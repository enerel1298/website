<!DOCTYPE html>
<html>
    <body>

        <h2>....</h2>
        <p>.....</p>

        <p id="demo"></p>

        <script>
            const myObject = {
                firstName:"Jhon",
                lastName:"Doe",
                fullName: function() {
                    return this.firstName + "" + this.lastName;
                }

            }
            document.getElementById("demo").innerHTML = 
            myObject.fullName();
        </script>
    </body>
</html>

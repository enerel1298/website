    <p id="demo"></p>
    <script>
        const person = {
            fullName: function(city, country) {
                return this.firstName + "" + this.lastName + "," +
                city + "," + country;
            }
        }
        const person1 = {
            firstName: "jhon",
            lastName: "doe",

        }
        const person2 = {
            firstName: "mary",
            lastName: "doe",
        }

        document.getElementById("demo").innerHTML = 
        person.fullName.call(person1, "oslo", "norway");
    </script>
    </body>
</html>

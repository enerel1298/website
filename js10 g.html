<!DOCTYPE html>
<html>
    <body>

        <p id="demo"></p>


        <script>
            const myJSON = '{"name":"Jhon", "age":30, "cars":["Ford", "BMW", "Fiat"]}';
            const myObj = JSON.parse(myJSON);

            let text = "";
            for (let i = 0; i < myObj.cars.length; i++) {
                text += myObj.cars[i] + ", ";
            }

            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>

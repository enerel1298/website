<!DOCTYPE html>
<html>
    <body>
        <p id="demo"></p>
        <script>
            const myJSON = '{"name":"Jhon", "age":30, "car":null}';
            const myObj = JSON.parse(myJSON);

            let text = "";
            for (const x in myObj) {
                text += myObj[x] + ", ";
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>

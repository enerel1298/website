<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box}
body {font-family: Verdana, sans-serif; margin:0}
.mySlides {display: none}
img {vertical-align: middle;}


.slideshow-container {
  max-width: 1000px;
  position: relative;
  margin: auto;
}


.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  padding: 16px;
  margin-top: -22px;
  color: white;
  font-weight: bold;
  font-size: 18px;
  transition: 0.6s ease;
  border-radius: 0 3px 3px 0;
  user-select: none;
}


.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}


.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.8);
}


.text {
  color: black;
  font-size: 15px;
  padding: 8px 12px;
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
}


.numbertext {
  color: wheat;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}


.dot {
  cursor: pointer;
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: black;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active, .dot:hover {
  background-color: #717171;
}


.fade {
  animation-name: fade;
  animation-duration: 1.5s;
}

@keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}


@media only screen and (max-width: 300px) {
    .prev, .next,.text {font-size: 11px}
}
</style>
</head>
<body>

<div class="slideshow-container">

<div class="mySlides fade">
  <div class="numbertext">1 / 8</div>
  <img src="1.jpg" width="100%" height="100%">
  <div class="text">Энх-Эрдэнэ</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">2 / 8</div>
  <img src="2.jpg" style="width:100%">
  <div class="text">Батсуурь</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">3 / 8</div>
  <img src="3.jpg" style="width:100%">
  <div class="text">Онолбек</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">4 / 8</div>
  <img src="4.jpg" style="width:100%">
  <div class="text">Ali</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">5 / 8</div>
  <img src="5.jpg" style="width:100%">
  <div class="text">Tomas</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">6 / 8</div>
  <img src="6.jpg" style="width:100%">
  <div class="text">Тэмүүгэн</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">7 / 8</div>
  <img src="7.jpg" style="width:100%">
  <div class="text">Золбоо</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">8 / 8</div>
  <img src="8.jpg" style="width:100%">
  <div class="text">Getso</div>
</div>

<a class="prev" onclick="plusSlides(-1)">❮</a>
<a class="next" onclick="plusSlides(1)">❯</a>

</div>
<br>

<div style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span> 
  <span class="dot" onclick="currentSlide(2)"></span> 
  <span class="dot" onclick="currentSlide(3)"></span> 
</div>

<script>
let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}

function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
}
</script>

</body>
</html>
